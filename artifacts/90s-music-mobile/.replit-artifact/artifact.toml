kind = "mobile"
previewPath = "/"
title = "90s Music Mobile"
description = "A nostalgic mobile listening experience for discovering and playing iconic 90s Bollywood music, with curated playlists, favorites, search, and a persistent music player inspired by cassette tapes and vintage album artwork."
version = "1.0.0"
id = "artifacts/90s-music-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 20191

[services.development]
run = "pnpm --filter @workspace/90s-music-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/90s-music-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/90s-music-mobile", "run", "serve" ]

[services.env]
PORT = "20191"
BASE_PATH = "/"
